name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13" # celle du Dockerfile
      - run: uv sync --frozen
      - run: uv run pytest

  deploy:
    # Ne déploie que ce qui a passé les tests sur main.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # L'auto-deploy de Coolify reste coupé : seul ce job déploie.
      - run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "https://coolify.loqa.fr/api/v1/deploy?uuid=waeh6x8jbv2vziglmlp8jwt9"
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
