name: CI

# Le déploiement passe par le webhook GitHub de Coolify, à chaque push sur main.
# La protection de main exige ce job vert sur une PR à jour : rien d'untesté n'y arrive.
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13" # celle du Dockerfile
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest
      # Dans le job requis : un Dockerfile cassé bloque le merge, donc le déploiement.
      - run: docker build -t simulator .
      # Smoke test : l'image démarre et calcule avec ses seules dépendances de prod.
      - run: |
          docker run -d --name api -p 8000:8000 simulator
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -X POST localhost:8000/simulation \
            -H 'Content-Type: application/json' \
            -d '{"persona": {"salaire_brut_mensuel": 3000}, "scenario": {"taux_troisieme_tranche_ir": 0.35}}' \
            || { docker logs api; exit 1; }
